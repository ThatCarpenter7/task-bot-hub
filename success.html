<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Payment successful — Task Bot</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function () {
      try {
        localStorage.setItem("task-bot-site-unlocked", "1");
        localStorage.setItem("task-bot-site-unlocked-at", String(Date.now()));
      } catch (_) {}
      // Brief confirmation, then home with ?paid=1
      setTimeout(function () {
        window.location.replace("./index.html?paid=1");
      }, 1200);
    })();
  </script>
</head>
<body class="success-page">
  <main class="success-card" role="status">
    <div class="success-icon" aria-hidden="true">✓</div>
    <h1>You’re in</h1>
    <p>Payment received. Unlocking chat and tools…</p>
    <p class="muted"><a href="./index.html?paid=1">Continue to Task Bot</a></p>
  </main>
</body>
</html>
